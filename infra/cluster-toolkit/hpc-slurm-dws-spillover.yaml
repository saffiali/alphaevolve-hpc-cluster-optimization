# Cluster Toolkit (gcluster) Target HPC Slurm / Cluster Director Blueprint
# demonstrating AlphaEvolve Pillar 1 & Pillar 3 architecture patterns:
#   - Multi-Tier Capacity Spillover:
#       Tier 1: Committed Reservations (compact placement GPU & Gen-4 CPU)
#       Tier 2: Dynamic Workload Scheduler (DWS Flex Start for GPU bursts)
#       Tier 3: Gen-4 On-Demand Shape-Guarded Partitions (C4D / N4)
#       Tier 4: Fault-Tolerant Spot Partition (high-throughput batch arrays)
#   - Tiered Storage Isolation:
#       /home on Managed Filestore NFS (metadata-protected via resume_rate)
#       /scratch on Managed Lustre / High-IOPS NVMe Parallel FS
#       /datasets on Cloud Storage Hierarchical Namespace (gcsfuse read-only)
#
# Usage:
#   gcluster deploy infra/cluster-toolkit/hpc-slurm-dws-spillover.yaml \
#     --vars project_id=<YOUR_GCP_PROJECT_ID>,region=us-central1

blueprint_name: hpc-slurm-dws-spillover

vars:
  project_id: <YOUR_GCP_PROJECT_ID>
  deployment_name: enterprise-hpc-slurm
  region: us-central1
  zone: us-central1-a
  enable_slurm_auth: true
  compute_zones:
    - us-central1-a
    - us-central1-b
    - us-central1-c
  gpu_reservation_name: projects/<YOUR_GCP_PROJECT_ID>/reservations/hpc-gpu-committed-res
  cpu_gen4_machine_type: c4d-standard-64
  interactive_machine_type: n4-standard-16
  ultramem_machine_type: m3-ultramem-64
  gpu_machine_type: a3-highgpu-8g
  datasets_bucket: <YOUR_GCP_PROJECT_ID>-hpc-curated-datasets

deployment_groups:
  - group: primary
    modules:
      # 1. Dedicated High-Bandwidth HPC VPC
      - id: hpc_network
        source: modules/network/vpc
        settings:
          network_name: $(vars.deployment_name)-net
          mtu: 8896

      # 2. Storage Tier A: /home on Filestore (User configs & lightweight scripts only)
      - id: home_filestore
        source: modules/file-system/filestore
        use: [hpc_network]
        settings:
          local_mount: /home
          filestore_tier: BASIC_SSD
          size_gb: 2560

      # 3. Storage Tier B: /scratch on Managed Parallel FS (High-IOPS checkpointing & shuffle)
      - id: scratch_parallel_fs
        source: modules/file-system/managed-lustre
        use: [hpc_network]
        settings:
          local_mount: /scratch
          size_gib: 18000
          per_unit_storage_throughput: 1000

      # 4. Storage Tier C: /datasets on Cloud Storage via gcsfuse (Read-Only cold/warm lake)
      - id: datasets_gcs
        source: modules/file-system/pre-existing-network-storage
        settings:
          remote_mount: $(vars.datasets_bucket)
          local_mount: /datasets
          fs_type: gcsfuse
          mount_options: implicit-dirs,ro,file-cache-max-size-mb=16384

      # 5. Partition 1: Interactive IDE & Notebook Pool (Right-sized N4, <2m startup SLA)
      # Prevents 2-8 vCPU interactive sessions from fragmenting 64-core Ultramem or GPU nodes.
      - id: interactive_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 2
          node_count_dynamic_max: 48
          machine_type: $(vars.interactive_machine_type)
          zones: $(vars.compute_zones)
          zone_target_shape: ANY
          bandwidth_tier: gvnic_enabled
          allow_automatic_updates: false

      - id: interactive_partition
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        use: [interactive_nodeset]
        settings:
          partition_name: interactive
          partition_conf:
            DefaultTime: "08:00:00"
            MaxTime: "24:00:00"
            MaxCPUsPerNode: 16
            SuspendTime: 600

      # 6. Partition 2: Tier-1 GPU Reservation + Tier-2 DWS Flex Start Spillover
      - id: gpu_reserved_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 0
          node_count_dynamic_max: 32
          machine_type: $(vars.gpu_machine_type)
          enable_placement: true
          reservation_name: $(vars.gpu_reservation_name)
          zones: [$(vars.zone)]
          bandwidth_tier: tier_1_enabled

      - id: gpu_dws_flex_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 0
          node_count_dynamic_max: 64
          machine_type: $(vars.gpu_machine_type)
          zones: $(vars.compute_zones)
          zone_target_shape: ANY_SINGLE_ZONE
          dws_flex:
            enabled: true
            max_run_duration: 604800s

      - id: gpu_accel_partition
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        use:
          - gpu_reserved_nodeset
          - gpu_dws_flex_nodeset
        settings:
          partition_name: gpu-accel
          partition_conf:
            SuspendTime: 300
            ResumeTimeout: 1200

      # 7. Partition 3: Gen-4 C4D Compute + Spot Spillover Pool (Evolved Bin-Packing Target)
      - id: cpu_gen4_ondemand_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 0
          node_count_dynamic_max: 128
          machine_type: $(vars.cpu_gen4_machine_type)
          enable_placement: true
          zones: $(vars.compute_zones)
          zone_target_shape: ANY
          bandwidth_tier: gvnic_enabled

      - id: cpu_gen4_spot_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 0
          node_count_dynamic_max: 256
          machine_type: $(vars.cpu_gen4_machine_type)
          enable_spot_vm: true
          zones: $(vars.compute_zones)
          zone_target_shape: ANY
          bandwidth_tier: gvnic_enabled

      - id: batch_compute_partition
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        use:
          - cpu_gen4_ondemand_nodeset
          - cpu_gen4_spot_nodeset
        settings:
          partition_name: compute
          is_default: true
          partition_conf:
            SuspendTime: 300
            ResumeTimeout: 900
            SuspendTimeout: 600

      # 8. Partition 4: Shape-Guarded High-Memory Analytics Pool (M3 Ultramem)
      - id: ultramem_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [hpc_network]
        settings:
          node_count_static: 0
          node_count_dynamic_max: 24
          machine_type: $(vars.ultramem_machine_type)
          zones: $(vars.compute_zones)
          zone_target_shape: ANY

      - id: highmem_partition
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        use: [ultramem_nodeset]
        settings:
          partition_name: highmem
          partition_conf:
            DefMemPerCPU: 16384
            SuspendTime: 300

      # 9. Slurm Login & Controller with AlphaEvolve-Tuned Backfill Parameters
      - id: slurm_login
        source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
        use: [hpc_network]
        settings:
          machine_type: n4-standard-8
          enable_login_public_ips: false

      - id: slurm_controller
        source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
        use:
          - hpc_network
          - home_filestore
          - scratch_parallel_fs
          - datasets_gcs
          - interactive_partition
          - gpu_accel_partition
          - batch_compute_partition
          - highmem_partition
          - slurm_login
        settings:
          machine_type: c4d-standard-16
          enable_controller_public_ips: false
          cloud_parameters:
            resume_rate: 250
            tree_width: 65533
            scheduler_parameters:
              - defer
              - bf_continue
              - bf_window=2880
              - bf_resolution=120
              - bf_max_job_user=64
              - batch_sched_delay=1
