schema_version = "1.1"

[task]
name = "hpc-skills/interactive-workbench-caches"
description = "Enterprise HPC Harbor benchmark task (dev split)"
authors = [{ name = "HPC Platform Benchmark Suite", email = "benchmarks@example.org" }]
keywords = ["containers", "jupyter", "cache-hygiene", "healthcheck"]

[metadata]
difficulty = "medium"
category = "interactive-ide"
split = "dev"
tags = ["containers", "jupyter", "cache-hygiene", "healthcheck"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 150.0

[environment]
build_timeout_sec = 600.0
cpus = 8
memory_mb = 32768
storage_mb = 61440
gpus = 0
mcp_servers = []
skills_dir = "/skills"

[verifier.checks]
dataset_gb = 6.0
walltime_hours = 4.0
spot_mode = false
required_protocols = ["scratch_nvme_staging", "partition_gpu_hygiene", "timeout_checkpoint_hard_stop"]

[verifier.env]

[environment.env]

[solution.env]
