schema_version = "1.1"

[task]
name = "hpc-skills/spot-docking-resume"
description = "Enterprise HPC Harbor benchmark task (dev split)"
authors = [{ name = "HPC Platform Benchmark Suite", email = "benchmarks@example.org" }]
keywords = ["spot-vms", "idempotent-resume", "cloud-batch"]

[metadata]
difficulty = "hard"
category = "preemptible-batch"
split = "dev"
tags = ["spot-vms", "idempotent-resume", "cloud-batch"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 190.0

[environment]
build_timeout_sec = 600.0
cpus = 16
memory_mb = 65536
storage_mb = 102400
gpus = 0
mcp_servers = []
skills_dir = "/skills"

[verifier.checks]
dataset_gb = 14.0
walltime_hours = 5.0
spot_mode = true
required_protocols = ["partition_gpu_hygiene", "timeout_checkpoint_hard_stop", "scratch_nvme_staging"]

[verifier.env]

[environment.env]

[solution.env]
