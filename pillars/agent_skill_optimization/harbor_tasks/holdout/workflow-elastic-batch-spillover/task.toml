schema_version = "1.1"

[task]
name = "hpc-skills/workflow-elastic-batch-spillover"
description = "Enterprise HPC Harbor benchmark task (holdout split)"
authors = [{ name = "HPC Platform Benchmark Suite", email = "benchmarks@example.org" }]
keywords = ["nextflow", "spot-spillover", "partition-hygiene", "object-storage"]

[metadata]
difficulty = "hard"
category = "workflow-orchestration"
split = "holdout"
tags = ["nextflow", "spot-spillover", "partition-hygiene", "object-storage"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 190.0

[environment]
build_timeout_sec = 600.0
cpus = 16
memory_mb = 65536
storage_mb = 122880
gpus = 0
mcp_servers = []
skills_dir = "/skills"

[verifier.checks]
dataset_gb = 26.0
walltime_hours = 5.0
spot_mode = true
required_protocols = ["partition_gpu_hygiene", "scratch_nvme_staging", "input_size_memory_rightsizing"]

[verifier.env]

[environment.env]

[solution.env]
