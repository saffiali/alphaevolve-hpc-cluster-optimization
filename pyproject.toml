[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaevolve-hpc-optimization"
version = "0.1.0"
description = "Autonomous Enterprise Scientific & AI HPC Optimization Suite using AlphaEvolve Evolutionary Search across Cluster Scheduling, Numerical Kernels, and Multi-Horizon Capacity Allocation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pillars*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
